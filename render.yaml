services:
  - type: web
    name: cluedo-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Origin the client is served from. Set this to the deployed client URL —
      # it is the CORS allowlist for both the API and the socket.
      - key: CLIENT_ORIGIN
        sync: false
      # Signing key for session tokens. generateValue makes Render mint a
      # strong random value once and keep it; the server refuses to boot in
      # production without it.
      - key: JWT_SECRET
        generateValue: true
      # Postgres connection string, wired from the managed database below.
      - key: DATABASE_URL
        fromDatabase:
          name: cluedo-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: cluedo-db
    plan: free
