services:
  - type: web
    name: cluedo-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Origin the client is served from. Set this to the deployed client URL —
      # it is the CORS allowlist for both the API and the socket.
      - key: CLIENT_ORIGIN
        sync: false
      # Signing key for session tokens. generateValue makes Render mint a
      # strong random value once and keep it; the server refuses to boot in
      # production without it.
      - key: JWT_SECRET
        generateValue: true
      # Postgres connection string for the Neon database that holds the real
      # accounts and leaderboard. sync: false means Render does NOT store it
      # here — paste it into the service's Environment tab so the credential
      # never lands in the repo. Letting Render provision its own database
      # instead would point the live site at an empty one.
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
